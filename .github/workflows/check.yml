name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Dependabot pull requests are reminders only: merging one would make
      # the bot a contributor. Apply the update in your own pull request.
      - if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          echo "::error::Do not merge Dependabot pull requests. Apply the update in your own pull request; Dependabot then closes this one."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get install -y --no-install-recommends libglib2.0-bin zip unzip shellcheck
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run pack
      - run: npm run check:package
      - run: |
          for script in install.sh deploy.sh scripts/*.sh; do
            bash -n "$script"
          done
      - run: shellcheck --severity=warning install.sh deploy.sh scripts/*.sh
      - run: python3 -m py_compile scripts/test-session.py
      - uses: actions/upload-artifact@v7
        with:
          name: scratchpad-extension
          path: |
            build/*.shell-extension.zip
            build/*.shell-extension.zip.sha256
          if-no-files-found: error
